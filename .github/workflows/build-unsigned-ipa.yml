name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/clash-mi-loopback
      - experiment/sing-box-loopback

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned WrapPin IPA
    # WrapPin targets iOS 27 and uses the corresponding MapKit APIs.
    # The standard macos-15 image currently defaults to Xcode 16.4/iOS 18.5.
    runs-on: xcode-27
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Rebuild native pairing diagnostics
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          rm -rf Frameworks/WrapPinPairingFFI.xcframework
          ./scripts/build-pairing-engine.sh

      - name: Build the iPhone app without signing
        run: >-
          xcodebuild
          -project WrapPin.xcodeproj
          -scheme WrapPin
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath "$PWD/.derived-data"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=''
          clean build

      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p package/Payload
          cp -R .derived-data/Build/Products/Release-iphoneos/WrapPin.app package/Payload/WrapPin.app
          ditto -c -k --sequesterRsrc --keepParent package/Payload WrapPin-1.0.6-build15-sing-box-reflection.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: WrapPin-1.0.6-build15-sing-box-reflection
          path: WrapPin-1.0.6-build15-sing-box-reflection.ipa
          if-no-files-found: error
